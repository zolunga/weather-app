services:
  backend:
    build:
      context: ./backend
    container_name: weather-app-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 8000
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: weather-app-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
